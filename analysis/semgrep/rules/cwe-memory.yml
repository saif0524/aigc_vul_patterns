rules:
  - id: std-vector-invalidation
    message: Modifying an `std::vector` while iterating over it could cause the
      container to reallocate, triggering memory corruption.
    severity: ERROR
    metadata:
      likelihood: LOW
      impact: HIGH
      confidence: HIGH
      category: security
      subcategory:
        - vuln
      cert:
        - C
        - C++
        - EXP54-CPP
        - L1
        - L2
        - MEM30-C
      cwe:
        - "CWE-416: Use After Free"
      cwe2020-top25: true
      cwe2021-top25: true
      cwe2022-top25: true
      display-name: Use After Free
      functional-categories:
        - memory::sink::buffer-overflow
      references:
        - https://wiki.sei.cmu.edu/confluence/display/c/MEM30-C.+Do+not+access+freed+memory
        - https://wiki.sei.cmu.edu/confluence/display/cplusplus/EXP54-CPP.+Do+not+access+an+object+outside+of+its+lifetime
      technology:
        - cpp
      license: Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Memory Issues
    languages:
      - cpp
      - c
    min-version: 1.59.0
    patterns:
      - patterns:
          - pattern-either:
              - pattern-inside: >
                  for(std::vector<$TY>::$IT_TYPE $IT = $CONTAINER.begin(); $IT
                  != $CONTAINER.end(); ++$IT) {
                    ...
                  }
              - pattern-inside: >
                  for(std::vector<$TY>::$IT_TYPE $IT = $CONTAINER.begin(); $IT
                  != $CONTAINER.end(); $IT++) {
                    ...
                  }
              - pattern-inside: >
                  for(std::vector<$TY>::$IT_TYPE $IT = $CONTAINER.rbegin(); $IT
                  != $CONTAINER.rend(); ++$IT) {
                    ...
                  }
              - pattern-inside: >
                  for(std::vector<$TY>::$IT_TYPE $IT = $CONTAINER.rbegin(); $IT
                  != $CONTAINER.rend(); $IT++) {
                    ...
                  }
              - pattern-inside: >
                  for(std::vector<$TY>::$IT_TYPE $IT = $CONTAINER.begin(),
                  $IT_END = $CONTAINER.end(); $IT != $IT_END; ++$IT) {
                    ...
                  }
              - pattern-inside: >
                  for(std::vector<$TY>::$IT_TYPE $IT = $CONTAINER.begin(),
                  $IT_END = $CONTAINER.end(); $IT != $IT_END; $IT++) {
                    ...
                  }
              - pattern-inside: >
                  for(std::vector<$TY>::$IT_TYPE $IT = $CONTAINER.rbegin(),
                  $IT_END = $CONTAINER.rend(); $IT != $IT_END; ++$IT) {
                    ...
                  }
              - pattern-inside: >
                  for(std::vector<$TY>::$IT_TYPE $IT = $CONTAINER.rbegin(),
                  $IT_END = $CONTAINER.rend(); $IT != $IT_END; $IT++) {
                    ...
                  }
          - patterns:
              - pattern-either:
                  - patterns:
                      - pattern: $CONTAINER.erase($IT);
                      - pattern-not: $IT = $CONTAINER.erase($IT);
                  - pattern-either:
                      - pattern: $CONTAINER.assign(...)
                      - pattern: $CONTAINER.clear(...)
                      - pattern: $CONTAINER.emplace_back(...)
                      - pattern: $CONTAINER.insert(...)
                      - pattern: $CONTAINER.resize(...)
                      - pattern: $CONTAINER.push_back(...)
                      - pattern: $CONTAINER.reserve(...)
                      - pattern: $CONTAINER.shrink_to_fit(...)
                      - pattern: $CONTAINER.resize(...)
                      - pattern: $CONTAINER.pop_back(...)
              - pattern-not-inside: |
                  for(...) {
                    ...
                    break;
                  }
              - pattern-not-inside: |
                  for(...) {
                    ...
                    continue;
                  }
              - pattern-not-inside: |
                  for(...) {
                    ...
                    goto $LABEL;
                  }
              - pattern-not-inside: |
                  for(...) {
                    ...
                    return;
                  }
              - pattern-not-inside: |
                  for(...) {
                    ...
                    return $RET;
                  }





  - id: double-delete
    message: "`$SINK_VAR` has previously been deleted which will trigger a
      double-free vulnerability. This may lead to memory corruption."
    severity: ERROR
    metadata:
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      category: security
      subcategory:
        - vuln
      cert:
        - C
        - C++
        - L1
        - MEM50-CPP
      cwe:
        - "CWE-415: Double Free"
      display-name: Double Free
      references:
        - https://wiki.sei.cmu.edu/confluence/display/cplusplus/MEM50-CPP.+Do+not+access+freed+memory
      technology:
        - cpp
      license: Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Memory Issues
    languages:
      - cpp
      - c
    mode: taint
    min-version: 1.59.0
    options:
      interfile: true
      taint_only_propagate_through_assignments: true
    pattern-sources:
      - by-side-effect: only
        patterns:
          - pattern-either:
              - pattern: delete $LOCAL_VAR
              - pattern: delete[] $LOCAL_VAR
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $RETURN_TYPE $FUNC(...)
                      {
                        ...
                        $LOCAL_VAR_TYPE $LOCAL_VAR = ...;
                        ...
                      }
                  - pattern-not-inside: |
                      $RETURN_TYPE $FUNC(...)
                      {
                        ...
                        static $LOCAL_VAR_TYPE $LOCAL_VAR = ...;
                        ...
                      }
              - patterns:
                  - pattern-inside: |
                      $RETURN_TYPE $FUNC(...)
                      {
                        ...
                        $LOCAL_VAR_TYPE $LOCAL_VAR;
                        ...
                      }
                  - pattern-not-inside: |
                      $RETURN_TYPE $FUNC(...)
                      {
                        ...
                        static $LOCAL_VAR_TYPE $LOCAL_VAR;
                        ...
                      }
              - pattern: |
                  $RETURN_TYPE $FUNC(..., $LOCAL_VAR_TYPE $LOCAL_VAR, ...) {
                    ...
                  }
          - focus-metavariable: $LOCAL_VAR
          - pattern-not-inside: "[...](...) { ... }"
          - pattern-not-inside: "[...](...) -> $LAMBDA_RETURN_TYPE { ... }"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: delete $SINK_VAR
              - pattern: delete[] $SINK_VAR
          - focus-metavariable: $SINK_VAR
    pattern-sanitizers:
      - by-side-effect: true
        patterns:
          - pattern: $FUNC(..., &$VAR, ...)
          - focus-metavariable: $VAR
      - by-side-effect: true
        patterns:
          - pattern: $VAR[$INDEX]
          - focus-metavariable: $VAR



  - id: double-free
    message: "`$SINK_VAR` has previously been freed which will trigger a double-free
      vulnerability. This may lead to memory corruption."
    severity: ERROR
    metadata:
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      category: security
      subcategory:
        - vuln
      cert:
        - C
        - C++
        - L1
        - MEM30-C
        - MEM50-CPP
      cwe:
        - "CWE-415: Double Free"
      display-name: Double Free
      references:
        - https://wiki.sei.cmu.edu/confluence/display/c/MEM30-C.+Do+not+access+freed+memory
        - https://wiki.sei.cmu.edu/confluence/display/cplusplus/MEM50-CPP.+Do+not+access+freed+memory
      supersedes:
        - c.lang.security.double-free.double-free
      technology:
        - cpp
      license: Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Memory Issues
    languages:
      - cpp
      - c
    mode: taint
    min-version: 1.59.0
    options:
      interfile: true
      taint_only_propagate_through_assignments: true
    pattern-sources:
      - by-side-effect: only
        patterns:
          - pattern-either:
              - pattern: free($LOCAL_VAR)
              - pattern: std::free($LOCAL_VAR)
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $RETURN_TYPE $FUNC(...)
                      {
                        ...
                        $LOCAL_VAR_TYPE $LOCAL_VAR = ...;
                        ...
                      }
                  - pattern-not-inside: |
                      $RETURN_TYPE $FUNC(...)
                      {
                        ...
                        static $LOCAL_VAR_TYPE $LOCAL_VAR = ...;
                        ...
                      }
              - patterns:
                  - pattern-inside: |
                      $RETURN_TYPE $FUNC(...)
                      {
                        ...
                        $LOCAL_VAR_TYPE $LOCAL_VAR;
                        ...
                      }
                  - pattern-not-inside: |
                      $RETURN_TYPE $FUNC(...)
                      {
                        ...
                        static $LOCAL_VAR_TYPE $LOCAL_VAR;
                        ...
                      }
              - pattern: |
                  $RETURN_TYPE $FUNC(..., $LOCAL_VAR_TYPE $LOCAL_VAR, ...) {
                    ...
                  }
          - focus-metavariable: $LOCAL_VAR
          - pattern-not-inside: "[...](...) { ... }"
          - pattern-not-inside: "[...](...) -> $LAMBDA_RETURN_TYPE { ... }"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: free($SINK_VAR)
              - pattern: std::free($SINK_VAR)
          - focus-metavariable: $SINK_VAR
    pattern-sanitizers:
      - by-side-effect: true
        patterns:
          - pattern: $FUNC(..., &$VAR, ...)
          - focus-metavariable: $VAR
      - by-side-effect: true
        patterns:
          - pattern: $VAR[$INDEX]
          - focus-metavariable: $VAR  



  - id: return-c-str
    message: "`$FUNC` returns a pointer to the memory owned by `$STR`. This pointer
      is invalid after `$STR` goes out of scope, which can trigger a use after
      free."
    severity: ERROR
    metadata:
      likelihood: LOW
      impact: HIGH
      confidence: HIGH
      category: security
      subcategory:
        - vuln
      cert:
        - C
        - C++
        - DCL30-C
        - EXP54-CPP
        - L2
      cwe:
        - "CWE-416: Use After Free"
      cwe2020-top25: true
      cwe2021-top25: true
      cwe2022-top25: true
      display-name: Use After Free
      functional-categories:
        - memory::search::use-after-free
      references:
        - https://wiki.sei.cmu.edu/confluence/display/c/DCL30-C.+Declare+objects+with+appropriate+storage+durations
        - https://wiki.sei.cmu.edu/confluence/display/cplusplus/EXP54-CPP.+Do+not+access+an+object+outside+of+its+lifetime
      technology:
        - cpp
      license: Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Memory Issues
    languages:
      - cpp
      - c
    min-version: 1.59.0
    patterns:
      - patterns:
          - metavariable-regex:
              metavariable: $METHOD
              regex: c_str|data
          - pattern-either:
              - patterns:
                  - pattern: return $STR.$METHOD();
                  - metavariable-type:
                      metavariable: $STR
                      types:
                        - basic_string<$TYPE>
                        - std::basic_string<$TYPE>
                        - string
                        - std::string
                        - wstring
                        - std::wstring
                  - pattern-either:
                      - patterns:
                          - pattern-inside: |
                              $RETURN_TYPE * $FUNC(...)
                              {
                                ...
                                $LOCAL_VAR_TYPE $STR = ...;
                                ...
                              }
                          - pattern-not-inside: |
                              $RETURN_TYPE * $FUNC(...)
                              {
                                ...
                                static $LOCAL_VAR_TYPE $STR = ...;
                                ...
                              }
                      - patterns:
                          - pattern-inside: |
                              $RETURN_TYPE * $FUNC(...)
                              {
                                ...
                                $LOCAL_VAR_TYPE $STR;
                                ...
                              }
                          - pattern-not-inside: |
                              $RETURN_TYPE * $FUNC(...)
                              {
                                ...
                                static $LOCAL_VAR_TYPE $STR;
                                ...
                              }
                      - pattern: |
                          $RETURN_TYPE * $FUNC(..., $LOCAL_VAR_TYPE $STR, ...) {
                            ...
                          }
              - pattern: return basic_string<$TYPE>(...).$METHOD();
              - pattern: return std::basic_string<$TYPE>(...).$METHOD();
              - pattern: return string(...).$METHOD();
              - pattern: return std::string(...).$METHOD();
              - pattern: return wstring(...).$METHOD();
              - pattern: return std::wstring(...).$METHOD();