rules:
  # =========================
  # Memory safety
  # =========================
  - id: cpp-dangerous-strcpy
    languages: [cpp]
    severity: ERROR
    message: Use of unsafe string function.
    pattern-either:
      - pattern: strcpy(...)
      - pattern: gets(...)
      - pattern: sprintf(...)
    metadata:
      cwe: CWE-120

  # =========================
  # Integer overflow
  # =========================
  - id: cpp-integer-overflow-add
    languages: [cpp]
    severity: WARNING
    message: Possible integer overflow in addition.
    pattern: $X + $Y
    metadata:
      cwe: CWE-190

  - id: cpp-integer-overflow-mul
    languages: [cpp]
    severity: WARNING
    message: Possible integer overflow in multiplication.
    pattern: $X * $Y
    metadata:
      cwe: CWE-190

  # =========================
  # Allocation issues
  # =========================
  - id: cpp-allocation-mul
    languages: [cpp]
    severity: ERROR
    message: Possible integer overflow in allocation size.
    pattern-either:
      - pattern: malloc($X * $Y)
      - pattern: calloc($X, $Y)
      - pattern: new $T[$X * $Y]
    metadata:
      cwe: CWE-190

  # =========================
  # Bounds (heuristic)
  # =========================
  - id: cpp-array-index-variable
    languages: [cpp]
    severity: WARNING
    message: Array indexed by variable; bounds may be unchecked.
    pattern: $A[$I]
    metadata:
      cwe: CWE-119

  - include 