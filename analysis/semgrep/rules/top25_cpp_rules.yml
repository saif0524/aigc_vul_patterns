rules:
  # =====================
  # CWE-120: Unsafe string functions
  # =====================
  - id: cwe-120-unsafe-string
    languages: [cpp]
    severity: ERROR
    message: Use of unsafe string function.
    pattern-either:
      - pattern: "strcpy(...)"
      - pattern: "gets(...)"
      - pattern: "sprintf(...)"
    metadata:
      cwe: CWE-120

  # =====================
  # CWE-190: Integer overflow (allocation)
  # =====================
  - id: cwe-190-allocation-overflow
    languages: [cpp]
    severity: WARNING
    message: Possible integer overflow in allocation size.
    pattern-either:
      - pattern: "malloc($X * $Y)"
      - pattern: "calloc($X, $Y)"
      - pattern: "new $T[$X * $Y]"
    metadata:
      cwe: CWE-190

  # =====================
  # CWE-119 / 787: Out-of-bounds access (heuristic)
  # =====================
  - id: cwe-119-array-index
    languages: [cpp]
    severity: WARNING
    message: Variable array index without explicit bounds check.
    pattern: "$A[$I]"
    metadata:
      cwe: CWE-119


  # =====================
  # CWE-476: NULL pointer dereference (heuristic)
  # =====================
  - id: cwe-476-null-deref
    languages: [cpp]
    severity: WARNING
    message: Possible NULL pointer dereference.
    pattern: "*$X"
    metadata:
      cwe: CWE-476