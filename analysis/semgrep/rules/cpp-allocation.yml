rules:
  - id: cpp-allocation-mul
    languages: [cpp]
    severity: ERROR
    message: Possible integer overflow in allocation size.
    pattern-either:
      - pattern: malloc($X * $Y)
      - pattern: calloc($X, $Y)
      - pattern: new $T[$X * $Y]
    metadata:
      cwe: CWE-190

  - id: cpp-tainted-allocation-size
    languages: [cpp]
    severity: ERROR
    message: Allocation size may be tainted.
    pattern: malloc($X)
    metadata:
      cwe: CWE-789